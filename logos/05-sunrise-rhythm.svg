<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
  <!-- Rising sun -->
  <circle cx="64" cy="58" r="32" fill="#5d9c59"/>
  <!-- Horizon covers the lower half of the sun -->
  <rect x="30" y="74" width="68" height="54" fill="#16241c"/>
  <!-- Horizon line -->
  <line x1="14" y1="92" x2="114" y2="92" stroke="#5d9c59" stroke-width="5" stroke-linecap="round"/>
  <!-- Heartbeat pulse above the horizon -->
  <polyline points="22,92 36,92 40,92 44,74 48,92 52,92 59,54 66,92 70,92 74,104 78,92 92,92 106,92"
    fill="none" stroke="#a3c585" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
</svg>