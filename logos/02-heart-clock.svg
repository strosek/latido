<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
  <!-- Heart-shaped clock face: bounding box ~x1.55-22.45, y3-21.23 in path space.
       translate = 64 - center*scale, so the heart lands centered on the viewBox. -->
  <g transform="translate(-0.8 -1.4) scale(5.4)">
    <path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"
      fill="none" stroke="#5d9c59" stroke-width="1.6" stroke-linejoin="round"/>
  </g>
  <!-- Clock hands at 10:10, pivoting on the heart's center -->
  <g stroke="#a3c585" stroke-width="5" stroke-linecap="round">
    <line x1="64" y1="58" x2="49.5" y2="49.5"/>
    <line x1="64" y1="58" x2="85" y2="46"/>
  </g>
  <circle cx="64" cy="58" r="4" fill="#a3c585"/>
</svg>