<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
  <!-- Clock face -->
  <circle cx="64" cy="64" r="56" fill="#16241c" stroke="#5d9c59" stroke-width="5"/>
  <!-- Tick marks (12/3/6/9) -->
  <g stroke="#5d9c59" stroke-width="4" stroke-linecap="round">
    <line x1="64" y1="12" x2="64" y2="19"/>
    <line x1="116" y1="64" x2="109" y2="64"/>
    <line x1="64" y1="116" x2="64" y2="109"/>
    <line x1="12" y1="64" x2="19" y2="64"/>
  </g>
  <!-- Clock hands at 10:10 -->
  <g stroke="#a3c585" stroke-width="5" stroke-linecap="round">
    <line x1="64" y1="66" x2="45" y2="52"/>
    <line x1="64" y1="66" x2="83" y2="52"/>
  </g>
  <circle cx="64" cy="66" r="4" fill="#a3c585"/>
  <!-- Heartbeat pulse -->
  <polyline points="24,66 36,66 40,66 44,52 48,66 52,66 58,34 64,66 68,66 72,76 76,66 88,66 104,66"
    fill="none" stroke="#d4b483" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
</svg>